<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>برای الینا ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="sparkles"></div>

    <main class="app">

        <h1>الینا به برنامم خوش اومدی 🥹❤️</h1>

        <button id="helloButton">
            سلام!
        </button>

        <div id="questionSection" class="hidden">

            <p class="question">
                می تونی با من بیای سر قرار؟🥹
            </p>

            <div class="buttons">

                <button id="yesButton" class="yes">
                    آره ❤️
                </button>

                <button id="noButton" class="no">
                    نه!
                </button>

            </div>

        </div>

        <div id="calendarSection" class="hidden">

            <h2>
                پس بریم تاریخ قرارمون رو انتخاب کنیم 🥹❤️
            </h2>

            <input
                type="date"
                id="dateInput"
            >

            <input
                type="time"
                id="timeInput"
            >

            <button id="confirmButton">
                این تاریخ رو انتخاب می کنم ❤️
            </button>

        </div>

        <div id="finalSection" class="hidden">

            <div class="heart">
                ❤️
            </div>

            <h2>
                پس توی این تاریخ می بینمت 🥹
            </h2>

            <p id="finalDate"></p>

            <p>
                منتظرت می مونم الینا ❤️🥹✨
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
